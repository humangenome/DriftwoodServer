name: checks

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Version consistency
        run: ./tools/ci/assert-version.sh
      - name: Build the supervisor
        run: dotnet build src/DriftwoodServer/DriftwoodServer.csproj -c Release
      - name: Test
        run: dotnet test src/DriftwoodServer.Tests/DriftwoodServer.Tests.csproj -c Release --no-build
      - name: Where the host mod is built
        # The host mod and the bench client compile against the game's own assemblies, which are
        # never committed, so CI cannot build them. The release gate is in the packager instead:
        # scripts/package-server-overlay.sh refuses to package unless tools/ci/check-game-build.sh
        # passes against the game build in GAME_MANAGED_DIR, and the release carries its output.
        run: echo "The host mod is built and checked against the game build by scripts/package-server-overlay.sh (release asset build-check.txt)"
      - name: Leak and clone-residue scan
        run: ./tools/ci/check-leaks.sh
      - name: Required-files declaration
        run: ./tools/ci/check-required-files.sh
